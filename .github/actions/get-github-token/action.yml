---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Get GitHub App token
description: Mint an installation token for the CI GitHub App

# The secrets context is not available inside composite action files,
# so callers must pass these in explicitly.
inputs:
  private_key:
    description: GitHub App private key
    required: true
  app_id:
    description: GitHub App ID
    required: true

outputs:
  token:
    description: GitHub App installation token
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Mint installation token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        private-key: ${{ inputs.private_key }}
        app-id: ${{ inputs.app_id }}
