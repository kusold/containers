---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Trivy Container Scanning"

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering
  workflow_call:

env:
  REGISTRY: ghcr.io

jobs:
  discover-images:
    uses: kusold/containers/.github/workflows/discover-images.yaml@main
    secrets: inherit

  scan-images:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: discover-images
    permissions:
      contents: read
      packages: read # Required for querying package versions
      security-events: write # Required for uploading SARIF results
    strategy:
      matrix:
        image: ${{ fromJSON(needs.discover-images.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get newest image tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query GitHub Packages API for available tags
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/versions" || echo "[]")

          # Extract tags from the response
          TAGS=$(echo "$RESPONSE" | jq -r '.[].metadata.container.tags[]?' 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            echo "No tags found for ${{ matrix.image }}"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prefer semver-shaped tags (v?X.Y[.Z...]) and pick the highest.
          # Falls back to all tags when none match. This ignores legacy
          # codename tags (e.g. curl's trixie-20260623) that sort above
          # the semver ones under sort -V and resolve to a stale image.
          SEMVER_TAGS=$(echo "$TAGS" | grep -E '^v?[0-9]+(\.[0-9]+)*$' || true)
          if [ -n "$SEMVER_TAGS" ]; then
            NEWEST_TAG=$(echo "$SEMVER_TAGS" | sort -V | tail -n1)
          else
            NEWEST_TAG=$(echo "$TAGS" | sort -V | tail -n1)
          fi

          echo "Found tags: $TAGS"
          echo "Using newest tag: $NEWEST_TAG"
          echo "tag=$NEWEST_TAG" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        if: steps.get-tag.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.get-tag.outputs.tag }}
          format: "sarif"
          output: "trivy-results-${{ matrix.image }}.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          # Only report vulnerabilities that have a fixed version available.
          # Unfixable findings cannot be actioned and drown out real signal.
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: steps.get-tag.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: "trivy-results-${{ matrix.image }}.sarif"
          category: "trivy-${{ matrix.image }}"

      - name: Run Trivy vulnerability scanner (table format)
        if: steps.get-tag.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.get-tag.outputs.tag }}
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
